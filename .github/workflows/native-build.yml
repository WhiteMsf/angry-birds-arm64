name: Native ARM64 Build

on:
  push:
  pull_request:

jobs:
  host-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure runtime contract tests
        run: |
          cmake -S . -B build/host-tests \
            -G Ninja \
            -DANGRY_BUILD_HOST_TESTS=ON

      - name: Build runtime contract tests
        run: cmake --build build/host-tests

      - name: Run runtime contract tests
        run: ctest --test-dir build/host-tests --output-on-failure

      - name: Check Windows builder contracts
        run: |
          python3 -m py_compile build.py tools/windows_builder.py tools/windows_builder_core.py
          python3 tools/test_windows_builder_core.py -v

  native-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;30.0.15729638"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build doctor
        run: python build.py doctor

      - name: Build native ARM64 runtime
        run: python build.py native --clean

      - name: Check repository diff
        run: git diff --check

      - name: Upload ARM64 runtime for Windows builder
        uses: actions/upload-artifact@v4
        with:
          name: arm64-runtime
          path: build/android-arm64/libangryarm64.so
          if-no-files-found: error
          retention-days: 7

  windows-builder:
    runs-on: windows-latest
    needs: [host-contracts, native-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Download ARM64 runtime
        uses: actions/download-artifact@v4
        with:
          name: arm64-runtime
          path: builder-runtime

      - name: Check builder contracts
        run: |
          python -m py_compile build.py tools/windows_builder.py tools/windows_builder_core.py
          python tools/test_windows_builder_core.py -v

      - name: Install pinned Windows packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3

      - name: Package Windows builder preview
        run: >-
          python tools/package_windows_builder.py
          --native-library builder-runtime/libangryarm64.so
          --output dist/windows-builder-preview

      - name: Upload Windows builder preview
        uses: actions/upload-artifact@v4
        with:
          name: windows-builder-preview
          path: dist/windows-builder-preview/*
          if-no-files-found: error
          retention-days: 7
