name: Native ARM64 Build

on:
  push:
  pull_request:

jobs:
  host-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure runtime contract tests
        run: |
          cmake -S . -B build/host-tests \
            -G Ninja \
            -DANGRY_BUILD_HOST_TESTS=ON

      - name: Build runtime contract tests
        run: cmake --build build/host-tests

      - name: Run runtime contract tests
        run: ctest --test-dir build/host-tests --output-on-failure

  native-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;30.0.15729638"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build doctor
        run: python build.py doctor

      - name: Build native ARM64 runtime
        run: python build.py native --clean

      - name: Check repository diff
        run: git diff --check